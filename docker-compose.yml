services:
  db:
    image: postgres:16-alpine
    container_name: eccai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eccai
      POSTGRES_USER: eccai_user
      POSTGRES_PASSWORD: eccai_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eccai_user -d eccai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: EccAi.Api/Dockerfile
    container_name: eccai-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=eccai;Username=eccai_user;Password=eccai_password
      AllowedHosts: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./EccAi.Web
      dockerfile: Dockerfile
    container_name: eccai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
